name: Manual Production D1 Database Backup

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Production D1 Database
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production env file
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CARDKNOX_SETTINGS_KEY: ${{ secrets.CARDKNOX_SETTINGS_KEY }}
        run: node scripts/write-env-from-ci.mjs

      - name: Sync Wrangler config
        run: node scripts/sync-wrangler-config.mjs --production

      - name: Execute Remote D1 Backup & Verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup-production-d1.mjs --remote

      - name: Upload Backup Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-backup
          path: migration/backups/production/
          retention-days: 30
